# Delivery contract for DeftWrite
schema: 1
name: deftwrite
vcs:
  host: github
  default_branch: main
  branch_prefix: feat/
qa:
  lint: bun run lint
  typecheck: bun run typecheck
staging:
  mode: local
  up: bun run dev:all
  url: http://localhost:5173
  down: docker compose down
browser:
  base_url: http://localhost:5173
  login:
    how: unknown
  smoke:
  - /
ship:
  gate: none
  ci_host: none
  push: git push origin HEAD
  pr: gh pr create --draft --fill
approval:
  required_for:
  - push
  - merge
  - deploy
  - migrations
tier: 2
source: .claude/sdlc.yml
