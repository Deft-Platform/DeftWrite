services:
  postgres:
    image: postgres:16-alpine
    container_name: deftwrite-db
    environment:
      POSTGRES_DB: deftwrite
      POSTGRES_USER: deftwrite
      POSTGRES_PASSWORD: deftwrite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deftwrite"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: deftwrite-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
